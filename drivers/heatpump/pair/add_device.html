<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      text-align: center;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="icon">&#x2705;</div>
  <h1 data-i18n="pair.add.title">Ready to Add</h1>
  <p data-i18n="pair.add.description">Your Itho Daalderop Amber heat pump is ready to be added to Homey.</p>
  
  <button id="add" data-i18n="pair.add.button">Add Device</button>

  <script>
    function onHomeyReady(Homey) {
      Homey.ready();
      
      document.getElementById('add').addEventListener('click', function() {
        Homey.emit('add_device').then(function(device) {
          Homey.createDevice(device);
        }).catch(function(err) {
          Homey.alert(err);
        });
      });
    }
  </script>
</body>
</html>
